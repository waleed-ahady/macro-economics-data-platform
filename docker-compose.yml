services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: macro
      POSTGRES_USER: macro
      POSTGRES_PASSWORD: macro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro -d macro"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://macro:macro@db:5432/macro
      WORLD_BANK_CONFIG_PATH: configs/world_bank.yml
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
    ports:
      - "8501:8501"

volumes:
  postgres_data:
